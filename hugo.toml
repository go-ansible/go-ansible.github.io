baseURL = "https://go-ansible.github.io/"
title = "go-ansible"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "kind" says what layer it is; "type" says whether it is a
# library you import or a service you run. "result" is the honest headline —
# what is proven, and by what.
[[params.repos]]
  name = "vault"
  what = "Ansible Vault-compatible AES256 encryption"
  kind = "crypto"
  type = "lib"
  proof = "encrypt with go-ansible/vault, decrypt with the real ansible-vault, and back"
  result = "Reads and writes the Ansible Vault 1.1 file format byte-for-byte: AES-256-CTR with a PBKDF2-HMAC-SHA256 derived key and an encrypt-then-MAC HMAC-SHA256 tag, hex-wrapped at 80 columns — the exact wire format of ansible.parsing.vault.VaultAES256, not a reinterpretation of it. Decryption fails closed on a bad HMAC with a constant-time comparison, before ever touching the ciphertext."
[[params.repos]]
  name = "inventory"
  what = "INI/YAML inventory parsing, groups, host patterns"
  kind = "data"
  type = "lib"
  proof = "group_vars/host_vars merge order and ancestor precedence match ansible-inventory"
  result = "Parses Ansible-compatible INI and YAML inventories — single file or a directory of them — into the same group/host graph Ansible builds: group_vars and host_vars merged in, ancestor groups resolved in the order that makes a child group's vars win over its parent's, and \"ungrouped\"/\"all\" computed the way Ansible computes them. Ships Ansible's own host-pattern language too: globs, numeric ranges, and colon/comma combinations with ! exclusion and & intersection."
[[params.repos]]
  name = "vars"
  what = "Ansible's variable precedence ladder"
  kind = "engine"
  type = "lib"
  proof = "an order-faithful subset of ansible-core's ~22 precedence levels"
  result = "Implements Ansible's variable precedence as a fixed ladder of named layers — role defaults up through play/role/block/task vars, registered vars, role params, and -e/--extra-vars — merged low to high so a value set higher always wins. Doesn't know about roles or plays itself; a playbook engine assigns each layer's content, this package only owns the merge order, plus a Which(key) call that answers \"why did this variable win?\"."
[[params.repos]]
  name = "template"
  what = "Jinja2-compatible templating + Ansible's filters/tests"
  kind = "engine"
  type = "lib"
  proof = "a bare {{ expr }} renders to its native type, not a stringified one — Ansible's own rule"
  result = "Renders Ansible-flavored Jinja2 on top of a Jinja2-compatible engine: string interpolation, control structures, and Ansible's own filter and test library (to_json/from_yaml, regex_* backed by a PCRE-compatible engine, b64encode, combine, and more) layered on Jinja2's built-ins. Implements the one rule that trips up naive ports: a value that is a single {{ expr }} with nothing else around it renders to the expression's native type — a list, a dict, an int — not a string."
[[params.repos]]
  name = "modules"
  what = "Module execution protocol + the core module library"
  kind = "exec"
  type = "lib"
  proof = "62 module names registered — the full ansible.builtin module set — run against a live go-remoteexec/transport connection"
  result = "Defines Ansible's module contract in Go — a function that takes a target Connection and already-rendered args, returns a changed/failed/msg Result — and ships all 62 of ansible.builtin's real modules on top of it: package management (apt/apt_key/apt_repository/deb822_repository/debconf/dnf/dnf5/dpkg_selections/package/package_facts/pip/rpm_key/yum_repository), file and content operations (assemble/blockinfile/copy/fetch/file/find/get_url/lineinfile/mount_facts/replace/slurp/stat/tempfile/template/unarchive), service and process control (reboot/service/service_facts/systemd/systemd_service/sysvinit/wait_for/wait_for_connection), users/groups/cron/hostname (user/group/cron/hostname), git/subversion, and control-flow helpers (assert/async_status/command/debug/expect/fail/gather_facts/getent/iptables/known_hosts/pause/ping/raw/script/set_fact/set_stats/setup/shell/uri/validate_argument_spec). Unlike real Ansible, which copies a Python script to the target and runs it there, each module here runs its logic on the control node and reaches the target only through the connection's Exec/Put/Fetch primitives."
[[params.repos]]
  name = "facts"
  what = "Fact gathering — the gather_facts/setup module equivalent"
  kind = "probe"
  type = "lib"
  proof = "collects the whole ansible_facts/ansible_* set in one shell round trip, no Python"
  result = "Gathers the standard ansible_facts/ansible_* set — distribution, os_family, architecture, and more — with a single portable shell probe sent over a go-remoteexec/transport connection, instead of copying and running Ansible's Python setup module."
[[params.repos]]
  name = "playbook"
  what = "Playbook/task/handler execution engine"
  kind = "engine"
  type = "lib"
  proof = "17 end-to-end tests against a real Local connection, including a real become/sudo run"
  result = "Runs a parsed playbook against an inventory with a real per-host linear-strategy executor: when/loop/register, block/rescue/always with genuine per-host recovery, notify/handlers, become, pre_tasks/post_tasks ordering, roles, include_role/import_role, include_tasks/import_tasks, vars_files, delegate_to, serial, tags/--tags/--skip-tags, meta: flush_handlers/clear_facts, add_host, group_by, and include_vars — wiring inventory+vars+template+modules+facts together the way ansible-playbook does. A handful of keys remain out of scope on purpose (any strategy but linear, import_playbook) or carry a documented single-host-layer limitation (nested role variable scoping, register: on setup:); see the feature matrix on this page for exactly which."
[[params.repos]]
  name = "cli"
  what = "The four Ansible CLI binaries"
  kind = "cli"
  type = "cli"
  proof = "a real playbook run against localhost proving idempotency/loops/ignore_errors/register+changed_when, plus real ad-hoc runs in both real ansible argument orderings"
  result = "Four thin binaries — ansible-playbook, ansible, ansible-vault, ansible-galaxy — wiring the libraries above (plus go-git for ansible-galaxy's role installs) into the actual commands Ansible users type. All four support --version; ansible-playbook also wires --tags/-t and --skip-tags. ansible-galaxy only clones a role from a git URL; it does not speak the galaxy.ansible.com API or install collections. All six of Go's 64-bit targets — amd64, arm64, riscv64, loong64, ppc64le, s390x — cross-compile clean and race-clean."
