baseURL = "https://go-ansible.github.io/"
title = "go-ansible"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "kind" says what layer it is; "type" says whether it is a
# library you import or a service you run. "result" is the honest headline —
# what is proven, and by what.
[[params.repos]]
  name = "vault"
  what = "Ansible Vault-compatible AES256 encryption"
  kind = "crypto"
  type = "lib"
  proof = "encrypt with go-ansible/vault, decrypt with the real ansible-vault, and back"
  result = "Reads and writes the Ansible Vault 1.1 file format byte-for-byte: AES-256-CTR with a PBKDF2-HMAC-SHA256 derived key and an encrypt-then-MAC HMAC-SHA256 tag, hex-wrapped at 80 columns — the exact wire format of ansible.parsing.vault.VaultAES256, not a reinterpretation of it. Decryption fails closed on a bad HMAC with a constant-time comparison, before ever touching the ciphertext."
[[params.repos]]
  name = "inventory"
  what = "INI/YAML inventory parsing, groups, host patterns"
  kind = "data"
  type = "lib"
  proof = "group_vars/host_vars merge order and ancestor precedence match ansible-inventory"
  result = "Parses Ansible-compatible INI and YAML inventories — single file or a directory of them — into the same group/host graph Ansible builds: group_vars and host_vars merged in, ancestor groups resolved in the order that makes a child group's vars win over its parent's, and \"ungrouped\"/\"all\" computed the way Ansible computes them. Ships Ansible's own host-pattern language too: globs, numeric ranges, and colon/comma combinations with ! exclusion and & intersection."
[[params.repos]]
  name = "vars"
  what = "Ansible's variable precedence ladder"
  kind = "engine"
  type = "lib"
  proof = "an order-faithful subset of ansible-core's ~22 precedence levels"
  result = "Implements Ansible's variable precedence as a fixed ladder of named layers — role defaults up through play/role/block/task vars, registered vars, role params, and -e/--extra-vars — merged low to high so a value set higher always wins. Doesn't know about roles or plays itself; a playbook engine assigns each layer's content, this package only owns the merge order, plus a Which(key) call that answers \"why did this variable win?\"."
[[params.repos]]
  name = "template"
  what = "Jinja2-compatible templating + Ansible's filters/tests"
  kind = "engine"
  type = "lib"
  proof = "a bare {{ expr }} renders to its native type, not a stringified one — Ansible's own rule"
  result = "Renders Ansible-flavored Jinja2 on top of a Jinja2-compatible engine: string interpolation, control structures, and Ansible's own filter and test library (to_json/from_yaml, regex_* backed by a PCRE-compatible engine, b64encode, combine, and more) layered on Jinja2's built-ins. Implements the one rule that trips up naive ports: a value that is a single {{ expr }} with nothing else around it renders to the expression's native type — a list, a dict, an int — not a string."
[[params.repos]]
  name = "modules"
  what = "Module execution protocol + the module library"
  kind = "exec"
  type = "lib"
  proof = "361 module names registered — the full ansible.builtin surface (62) plus ansible.posix (14) plus six community.general batches (285 of 577) — run against a live go-remoteexec/transport connection"
  result = "Defines Ansible's module contract in Go — a function that takes a target Connection and already-rendered args, returns a changed/failed/msg Result — and ships 361 modules on top of it: all 62 of ansible.builtin's real modules, all 14 of ansible.posix (synchronize is an honest, always-failing stub rather than a silent approximation — real synchronize runs rsync from the controller directly against the target's own SSH endpoint, which the Connection abstraction can't expose from inside a module), and six curated community.general batches — package managers (apk/homebrew/snap/flatpak/pacman/npm/yarn/pnpm/gem/bundler/composer/zypper/dnf_versionlock/macports/pkgin/pkgng/xbps/pkg5/portage/pipx/urpmi and more), language/dev tooling (cpanm/cargo/golang_package/maven_artifact/pear/opkg/django and Django extensions), filesystem/storage (archive/decompress/ini_file/xml/read_csv/crypttab/lvg/lvol/lvm_pv/btrfs/zfs/zpool/vdo/parted/filesystem/xfs_quota/write_binary_file and more), networking (nmcli/interfaces_file/iptables_state/ufw/nsupdate/wakeonlan/ip_netns), system/service management (sudoers/pam_limits/pamd/timezone/locale_gen/modprobe/cronvar/logrotate/puppet/monit/runit/sysrc/homectl/launchd/svc/nosh and more), SELinux (selinux_permissive/sefcontext/selogin/seport), Pacemaker cluster management, LDAP (ldap_entry/ldap_attrs/ldap_search/ldap_passwd/ldap_inc), FreeIPA (ipa_user/ipa_group/ipa_host/ipa_vault/ipa_pwpolicy and more), Redis, Consul (kv, acl policies/roles/tokens, agent services/checks), Kerberos, desktop/system config (dconf/osx_defaults/kdeconfig/java_keystore/xfconf/gconftool2 and more), LXD/LXC containers, HashiCorp Nomad, database admin (mssql_db/vertica_*/influxdb_* via sqlcmd/vsql/influx), RHEL subscription management, AIX (aix_devices/aix_filesystem/aix_lvg and more), Elastic Stack plugins (elasticsearch/logstash/kibana), Icinga2, Kopia backup, version control (bzr/hg), web/app servers (apache2/jboss), ISO tools (xorriso-backed), provisioning (cobbler_sync/cobbler_system), IPMI (ipmi_boot/ipmi_power), Univention UDM (udm_user/udm_group/udm_share/udm_dns_record/udm_dns_zone), XenServer (xenserver_guest/xenserver_facts and more), and a handful of misc modules (git_config/ssh_config/htpasswd/java_cert/mail) — deliberately excluding SaaS-API wrappers and cloud-VPS/hardware providers that need real API client SDKs rather than shell composition. Unlike real Ansible, which copies a Python script to the target and runs it there, each module here runs its logic on the control node and reaches the target only through the connection's Exec/Put/Fetch primitives."
[[params.repos]]
  name = "facts"
  what = "Fact gathering — the gather_facts/setup module equivalent"
  kind = "probe"
  type = "lib"
  proof = "collects the whole ansible_facts/ansible_* set in one shell round trip, no Python"
  result = "Gathers the standard ansible_facts/ansible_* set — distribution, os_family, architecture, and more — with a single portable shell probe sent over a go-remoteexec/transport connection, instead of copying and running Ansible's Python setup module."
[[params.repos]]
  name = "playbook"
  what = "Playbook/task/handler execution engine"
  kind = "engine"
  type = "lib"
  proof = "17 end-to-end tests against a real Local connection, including a real become/sudo run"
  result = "Runs a parsed playbook against an inventory with a real per-host linear-strategy executor: when/loop/register, block/rescue/always with genuine per-host recovery, notify/handlers, become, pre_tasks/post_tasks ordering, roles, include_role/import_role, include_tasks/import_tasks, import_playbook, vars_files, delegate_to, serial, tags/--tags/--skip-tags, meta: flush_handlers/clear_facts, add_host, group_by, and include_vars — wiring inventory+vars+template+modules+facts together the way ansible-playbook does. Only a strategy other than linear is rejected outright; a couple of edge cases carry a documented single-host-layer limitation (nested role variable scoping, register: on setup:); see the feature matrix on this page for exactly which."
[[params.repos]]
  name = "cli"
  what = "All 8 Ansible CLI binaries"
  kind = "cli"
  type = "cli"
  proof = "a real playbook run against localhost proving idempotency/loops/ignore_errors/register+changed_when, plus real ad-hoc runs in both real ansible argument orderings, plus a real interactive ansible-console session"
  result = "Eight thin binaries — ansible, ansible-playbook, ansible-vault, ansible-galaxy, ansible-pull, ansible-doc, ansible-config, ansible-console — wiring the libraries above (plus go-git for ansible-galaxy's role installs and ansible-pull's repo fetch) into the actual commands Ansible users type. All eight support --version; ansible-playbook also wires --tags/-t and --skip-tags. ansible-doc prints each module's own Go doc comment (not real ansible-doc's structured DOCUMENTATION-YAML rendering, stated plainly); ansible-config reads real ANSIBLE_* environment variables (no ansible.cfg file support); ansible-galaxy only clones a role from a git URL, no galaxy.ansible.com API or collections. Also published as a multi-arch FROM scratch OCI image, ghcr.io/go-ansible/cli, on every version tag. All six of Go's 64-bit targets — amd64, arm64, riscv64, loong64, ppc64le, s390x — cross-compile clean and race-clean."
